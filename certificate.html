<meta name="theme-color" content="#2447d6">
<style>
:root{--ink:#141414;--paper:#f7f5ef;--muted:#5f6272;--blue:#2447d6;--blue-d:#1a36a8;--blue-l:#dde5ff;--sun-l:#fff1b3;--butter:#ffd84d;--red:#d63a30;--display:'Jua','Mali',system-ui,sans-serif;--soft:0 10px 30px rgba(36,71,214,.12),0 2px 6px rgba(20,20,20,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#fff;padding:14px 14px 32px;min-height:100svh;-webkit-font-smoothing:antialiased}
body::before,body::after{content:none;display:none}
body::before{width:420px;height:300px;border-radius:64px;transform:rotate(-14deg);background:var(--blue-l);opacity:.7;right:-190px;top:-90px}
body::after{width:460px;height:260px;border-radius:72px;transform:rotate(12deg);background:var(--sun-l);opacity:.8;left:-210px;bottom:-60px}
.wrap{position:relative;max-width:440px;margin:0 auto;padding-top:50px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between}
.xbtn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;text-decoration:none}
.xbtn:hover{background:var(--butter)}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
h1{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 16px;text-align:center;font-family:var(--display);font-weight:400;line-height:1}
.mascot{width:54px;height:auto}
.t1{display:block;font-size:1.75rem}
.hl{color:var(--blue)}
.t2{display:block;margin-top:8px;font-size:1.05rem}
mark{background:linear-gradient(transparent 52%,var(--butter) 52%,var(--butter) 92%,transparent 92%);color:var(--blue);padding:1px 8px 0;border-radius:4px}
.main{display:grid;gap:14px}
.card{background:#fff;border:2px solid var(--ink);border-radius:26px;box-shadow:var(--soft);padding:18px 16px 16px}
label.l{display:block;font-family:var(--display);font-size:.95rem;margin:0 0 6px}
.field{position:relative}
.at-sign{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--blue);font-family:var(--display);font-size:1.1rem}
input[type=text]{width:100%;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:18px;padding:10px 14px 10px 36px;outline:none}
input[type=text]:focus{border-color:var(--blue)}
.hint{font-size:.72rem;color:var(--muted);margin-top:6px;line-height:1.45;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px;padding-top:16px;border-top:1px dotted rgba(20,20,20,.35)}
.tile{position:relative;min-width:0;background:#fff;border:2px dashed #9db0f0;border-radius:18px;padding:10px 6px 9px;text-align:center}
.tile.on{border-style:solid;border-color:var(--ink);background:var(--sun-l)}
.th{display:block;width:48px;height:48px;margin:0 auto 6px;border-radius:14px;border:2px solid var(--ink);background:#fff;object-fit:cover;object-position:top}
.nm{font-weight:800;font-size:.7rem;line-height:1.2;margin-bottom:8px}
.st{margin-top:6px;font-size:.64rem;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on .st{color:#14391f}
.rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:.65rem;line-height:1;cursor:pointer;padding:0}
.rm[hidden]{display:none}
.btn{width:100%;font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:.02em;cursor:pointer;color:#fff;padding:11px 15px 12px;border-radius:99px;background:var(--blue);border:2px solid var(--ink)}
.btn .i{margin-right:7px;vertical-align:-.2em}
.btn:hover{background:var(--blue-d)}
.btn:active{transform:scale(.98)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.alt:hover{background:var(--sun-l)}
.btn.sm{width:100%;font-size:.88rem;padding:6px 4px 7px;background:#fff;color:var(--ink);letter-spacing:0}
.btn.sm:hover{background:var(--butter)}
.prog{height:12px;margin-top:14px;border:1.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
#bar{height:100%;width:0;background:var(--blue);transition:width .3s}
.cnt{text-align:center;margin-top:8px;font-weight:800;font-size:.85rem}
.pv canvas{display:block;width:100%;height:auto;aspect-ratio:1;border:2px solid var(--ink);border-radius:22px;background:#97d6ff}
.acts{display:grid;gap:10px;margin-top:14px}

}
function cover(c,im,x,y,w,h){
  const k = Math.max(w/im.width, h/im.height), dw = im.width*k, dh = im.height*k;
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip(); c.drawImage(im, x+(w-dw)/2, y+(h-dh)/2, dw, dh); c.restore();
}
// table cell interiors inside the template's blue lines (1080 design space)
const CELLS = [[71,310],[384,309],[697,309]], CY = 388, CH = 639;
function render(c,S,ex){
  c.save(); c.scale(S,S);
  if(tplImg.complete && tplImg.naturalWidth) c.drawImage(tplImg,0,0,1080,1080);
  const n = clean($('acc').value);
  if(n) fitTxt(c,'@'+n,548,217,600,800,36);
  fitTxt(c,today(),562,262,480,800,36);
  COLS.forEach((col,i) => {
    const [x,w] = CELLS[i], s = shots[col.app];
    if(s) cover(c,s.img,x,CY,w,CH);
    else if(!ex){
      c.globalAlpha = .3; c.drawImage(icoImg[col.app],x+w/2-34,CY+250,68,68); c.globalAlpha = 1;
      c.font = '700 20px Nunito,sans-serif'; c.fillStyle = '#7f8fc9'; c.textAlign = 'center'; c.fillText('Upload '+col.app,x+w/2,CY+350);
    }
  });
  c.restore();
}
function draw(){ render(cv.getContext('2d'),2,false); }

/* ---------- form ---------- */
const flash = (t,type) => { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (type || ''); };
$('tiles').innerHTML = FORM_ORDER.map(a =>
  `<div class="tile" data-app="${a}"><button type="button" class="rm" hidden aria-label="Remove">✕</button>` +
  `<img class="th" src="${ICONS[a]}" alt=""><div class="nm">${a}</div>` +
  `<button type="button" class="btn sm up">Upload</button><div class="st">Upload screenshot</div>` +
  `<input type="file" accept="image/*" hidden></div>`).join('');

function sync(){
  let n = 0;
  document.querySelectorAll('.tile').forEach(t => {
    const a = t.dataset.app, s = shots[a]; if(s) n++;
    t.classList.toggle('on', !!s);
    t.querySelector('.th').src = s ? s.url : ICONS[a];
    t.querySelector('.up').textContent = s ? 'Change' : 'Upload';
    t.querySelector('.st').textContent = s ? '✓ ' + s.name : 'Upload screenshot';
    t.querySelector('.rm').hidden = !s;
  });
  $('bar').style.width = (n/3*100) + '%'; $('cnt').textContent = 'Uploaded ' + n + '/3';
  draw();
}
function setShot(app,file){
  if(!file) return;
  if(!/^image\//.test(file.type)) return flash('Please choose an image file.','err');
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => { if(shots[app]) URL.revokeObjectURL(shots[app].url); shots[app] = {img,url,name:file.name}; flash('',''); sync(); };
  img.onerror = () => { URL.revokeObjectURL(url); flash('Couldn’t open this image. Try a JPG or PNG file.','err'); };
  img.src = url;
}
$('tiles').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if(!t) return;
  if(e.target.closest('.up')) t.querySelector('input').click();
  else if(e.target.closest('.rm')){ const s = shots[t.dataset.app]; if(s) URL.revokeObjectURL(s.url); delete shots[t.dataset.app]; sync(); }
});
$('tiles').addEventListener('change', e => {
  const t = e.target.closest('.tile'); if(!t) return;
  setShot(t.dataset.app, e.target.files[0]); e.target.value = '';
});

$('acc').value = clean(store.get('fv_account'));
// account was entered at first login: only show the box if it is missing
$('accBox').hidden = !!$('acc').value;
if(store.get('fv_lang') === 'th'){ document.documentElement.lang = 'th'; $('upTitle').textContent = 'อัปโหลดรูปเพื่อรับใบเซอร์ติฟิเคต'; }
$('acc').addEventListener('input', () => {
  const v = clean($('acc').value); if($('acc').value !== v) $('acc').value = v;
  if(v) store.set('fv_account', v);
  draw();
});

/* ---------- save / share ---------- */
$('save').addEventListener('click', async () => {
  const n = clean($('acc').value);
  if(!n){ flash('Please log in on the main page first.','err'); $('accBox').hidden = false; $('acc').focus(); return; }
  try { await document.fonts.ready; } catch(e){}
  const o = document.createElement('canvas'); o.width = o.height = 2160;
  render(o.getContext('2d'),2,true);
  o.toBlob(async b => {
    if(!b) return flash('Couldn’t save the image. Please try again.','err');
    const fn = `daily-vote-${today().split('/').reverse().join('')}-${n}.png`, f = new File([b],fn,{type:'image/png'});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[f]})){
      try { await navigator.share({files:[f]}); return flash('Ready ✓','ok'); }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fn;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    flash('Image saved ✓','ok');
  },'image/png');
});
$('share').addEventListener('click', async () => {
  const n = clean($('acc').value);
  const text = `Daily Vote Collection 💙\nFor LMK#2 · ${today()}` + (n ? `\n@${n}` : '');
  const openX = () => {
    const p = new URLSearchParams({text});
    if(SHARE_HASHTAGS) p.set('hashtags',SHARE_HASHTAGS);
    if(/^https?:/.test(location.href)) p.set('url',location.origin + '/');
    window.open('https://twitter.com/intent/tweet?' + p.toString(),'_blank','noopener');
  };
  if(!n){ flash('Please log in on the main page first.','err'); $('accBox').hidden = false; $('acc').focus(); return; }
  try { await document.fonts.ready; } catch(e){}
  const o = document.createElement('canvas'); o.width = o.height = 2160;
  render(o.getContext('2d'),2,true);
  o.toBlob(async b => {
    if(!b) return flash('Couldn’t make the image. Please try again.','err');
    const fn = `daily-vote-${today().split('/').reverse().join('')}-${n}.png`, f = new File([b],fn,{type:'image/png'});
    // phones: open the share sheet with the image attached, then pick X
    if(/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[f]})){
      try { await navigator.share({files:[f], text}); return flash('Pick X in the share sheet ✓','ok'); }
      catch(e){ if(e && e.name === 'AbortError') return; }
    }
    // fallback (desktop etc.): X can't take an image from a link, so save it and open the post box
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fn;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    openX();
    flash('Image saved. Attach it to your post.','ok');
  },'image/png');
});

document.addEventListener('visibilitychange', () => { if(!document.hidden) draw(); });
document.fonts.load('800 36px Nunito')
  .catch(() => {}).then(draw);
draw();
</script>

<script>
function fitTxt(c,s,x,y,maxW,weight,size){
  let px = size + 2;
  c.font = `400 ${px}px Jua,Mali,system-ui,sans-serif`;
  while(c.measureText(s).width > maxW && px > 14){
    px -= 1;
    c.font = `400 ${px}px Jua,Mali,system-ui,sans-serif`;
  }
  c.fillStyle = '#141414'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText(s,x,y);
}

document.fonts.ready.then(draw);
